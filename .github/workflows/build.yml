name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore
        run: dotnet restore PolarH10.sln

      - name: Check formatting
        run: dotnet format PolarH10.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PolarH10.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PolarH10.sln --no-build --configuration Release --verbosity normal

      - name: Install site dependencies
        run: npm ci

      - name: Render Mermaid diagrams
        run: npm run diagram:render:all

      - name: Build Pages site
        run: npm run pages:build
