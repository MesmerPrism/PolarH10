name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore
        run: dotnet restore PolarH10.sln

      - name: Check formatting
        run: dotnet format PolarH10.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PolarH10.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PolarH10.sln --no-build --configuration Release --verbosity normal

      - name: Build unsigned Windows package
        run: powershell -ExecutionPolicy Bypass -File .\tools\app\Build-App-Package.ps1 -Unsigned -Version 0.0.0.0

      - name: Publish preview setup bootstrapper
        run: powershell -ExecutionPolicy Bypass -File .\tools\app\Publish-PreviewSetup.ps1 -Version 0.0.0.0

      - name: Upload unsigned Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PolarH10-msix-unsigned
          path: artifacts/windows-installer

      - name: Install site dependencies
        run: npm ci

      - name: Render Mermaid diagrams
        run: npm run diagram:render:all

      - name: Build Pages site
        run: npm run pages:build
